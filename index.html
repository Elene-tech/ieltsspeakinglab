<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Speaking Studio</title>
<style>
:root{
  --bg:#FBF7EE;--card:#fff;--ink:#26221B;--ink2:#51493B;--line:#E8DFCB;--soft:#FFFCF5;--edge:#5B5242;
  --green:#24774B;--green2:#1A5C3A;--lime:#C5DD84;--orange:#F2A068;--gold:#F0CB66;--orange-ink:#97470F;
  --ok:#DCF1E5;--okline:#2E8A5E;--bad:#FBE5DD;--badline:#B5573E;
  --s1:#24774B;--s1on:#fff;--s2:#F2A068;--s2on:#26221B;--s3:#F0CB66;--s3on:#26221B;--s4:#C5DD84;--s4on:#26221B;
  --a:#24774B;--on:#fff;--ink-a:#1A5C3A;--tint:#E3F2E8;
  --serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:1340px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px))}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--edge);outline-offset:2px}
[hidden]{display:none!important}
/* masthead */
.mast{background:linear-gradient(120deg,#24774B 0%,#1A5C3A 100%);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.mast{border-bottom:10px solid;border-image:linear-gradient(90deg,#F2A068 0 33%,#F0CB66 33% 66%,#C5DD84 66%) 1}
@media(min-width:1000px){.mast::before{content:"";position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--orange)}
.mast::after{content:"";position:absolute;right:120px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:var(--gold)}}
.mast .wrap{position:relative;z-index:1;padding-block:22px 20px}
.eyebrow{display:inline-block;background:var(--lime);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:3px 12px;border-radius:999px;margin:0 0 10px}
.mast h1{font-size:clamp(30px,6vw,50px);color:#fff}
.mast p.sub{margin:8px 0 0;max-width:46ch;font-size:16px;color:#fff}
/* side navigation */
.layout{max-width:1340px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left,0px)) 40px}
.side{position:sticky;top:0;z-index:30;margin:0 -14px 14px;background:#fff;border-bottom:2px solid var(--edge)}
.side-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 16px;background:#fff;border:0;cursor:pointer;font-weight:700;font-size:16px;text-align:left}
.side-toggle .tgl-ic{font-size:20px}
.side-toggle .cur{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-toggle .arr{font-size:14px;color:var(--ink2)}
.side-box{display:none;max-height:68vh;overflow:auto;padding:6px 10px 12px;border-top:1px solid var(--line);background:#fff;box-shadow:0 12px 20px rgba(38,34,27,.15)}
.side.open .side-box{display:block}
.side-h{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:10px 8px 4px}
.ti{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:0;border-radius:12px;background:transparent;cursor:pointer;text-align:left;font-size:15px;font-weight:700;color:var(--ink)}
.ti .num{flex:0 0 auto;min-width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--ink-a);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.ti .ic{font-size:18px;flex:0 0 auto}
.ti .tn{flex:1;line-height:1.25}
.ti:hover{background:var(--tint)}
.ti[aria-current=true]{background:var(--a);color:var(--on)}
.ti[aria-current=true] .num{background:#fff;color:var(--ink-a)}
.ti[aria-current=true]:hover{background:var(--a)}
@media(min-width:900px){
  .layout{display:grid;grid-template-columns:276px minmax(0,1fr);gap:26px;align-items:start;padding-top:20px}
  .side{margin:0;top:14px;border:2px solid var(--edge);border-radius:18px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;overflow:hidden}
  .side-toggle{display:none}
  .side-box{display:block;max-height:none;overflow:auto;border:0;box-shadow:none;padding:8px 10px 12px;flex:1}
  .side-h:first-child{margin-top:4px}
}
.tcard .num{font-size:13px;font-weight:700;background:var(--tint);color:var(--ink-a);min-width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
main{padding-block:22px 70px}
/* topic header */
.thead{background:var(--a);color:var(--on);border-radius:18px;padding:18px 22px;display:flex;gap:16px;align-items:center;margin-bottom:16px;box-shadow:0 6px 0 var(--ink-a)}
.thead .big{font-size:44px;line-height:1}
.thead h2{font-size:clamp(26px,5vw,38px)}
.thead p{margin:4px 0 0;max-width:62ch}
.sub-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{min-height:44px;border:2.5px solid var(--edge);background:#fff;border-radius:12px;padding:6px 16px;font-weight:700;cursor:pointer}
.tab[aria-current=true]{background:var(--ink);color:#fff}
.tab:hover{background:var(--tint)}
.tab[aria-current=true]:hover{background:var(--ink)}
.stack>*+*{margin-top:16px}
/* structure banner */
.struct{background:#fff;border:2.5px solid var(--edge);border-radius:16px;padding:14px 16px}
.struct h3{font-size:19px;margin-bottom:4px}
.struct p.m{margin:0 0 10px;color:var(--ink2);font-size:15px}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.step{border-radius:12px;padding:10px 12px;border:2px solid var(--edge)}
.step b{display:block;font-family:var(--serif);font-size:19px}
.step span{font-size:14.5px;display:block;margin-top:2px}
.s1{background:var(--s1);color:var(--s1on)}.s2{background:var(--s2);color:var(--s2on)}.s3{background:var(--s3);color:var(--s3on)}.s4{background:var(--s4);color:var(--s4on)}
/* question cards */
.qcard{background:#fff;border:2.5px solid var(--a);border-radius:16px;padding:14px 16px;box-shadow:0 5px 0 var(--a)}
.qcard .qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--a);color:var(--on);font-weight:700;display:flex;align-items:center;justify-content:center}
.qt{font-family:var(--serif);font-size:20px;line-height:1.3;margin:3px 0 0;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--tint);color:var(--ink-a);padding:2px 10px;border-radius:999px;margin-bottom:4px}
.qbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.btn{min-height:44px;border-radius:10px;padding:6px 16px;font-weight:700;cursor:pointer;border:2.5px solid var(--edge);background:#fff}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--a);color:var(--on)}.btn.primary:hover{filter:brightness(.93);background:var(--a)}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime:hover{filter:brightness(.95);background:var(--lime)}
.btn.gold{background:var(--gold);color:var(--ink)}.btn.gold:hover{filter:brightness(.95);background:var(--gold)}
.btn.sm{min-height:44px}
.panel{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--tint);border:2px solid var(--a)}
.panel h4{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-a);margin-bottom:6px;font-family:var(--sans)}
.panel ul{margin:0;padding-left:20px}.panel li{margin-bottom:4px}
.model{font-family:var(--serif);font-size:17.5px;line-height:1.75}
.seg{padding:1px 4px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.seg sup{font-family:var(--sans);font-size:10.5px;font-weight:700;margin-left:3px;letter-spacing:.04em}
.model mark,.panel mark{background:var(--lime);color:var(--ink);padding:0 3px;border-radius:3px;font-weight:700}
.s1 mark,.s2 mark,.s3 mark,.s4 mark{background:#fff;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.legend span{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
/* timer */
.timer{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:12px;padding:4px 6px 4px 14px}
.timer .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:62px}
.timer .ph{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);font-weight:700}
.timer .btn{min-height:40px;padding:2px 12px;border-color:#fff;color:var(--ink);background:#fff}.timer .btn:hover{background:var(--lime)}
.timer.done{background:var(--orange);color:var(--ink)}
.timer.done .ph{color:var(--ink)}
/* cue card */
.cue{background:#FFFDF6;border:2px solid var(--edge);border-top:12px solid var(--a);border-radius:12px;padding:18px 22px;box-shadow:6px 6px 0 var(--a)}
.cue h3{font-size:24px;margin-bottom:8px}
.cue p{margin:6px 0}
.cue ul{margin:6px 0 10px;padding-left:22px}.cue li{margin-bottom:3px;font-size:17px}
.cue .fl{font-style:italic;color:var(--ink2)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.field{border-radius:12px;padding:10px 12px;border:2px solid var(--edge)}
.field label{font-weight:700;display:block;margin-bottom:4px;font-family:var(--serif);font-size:17px}
.field small{display:block;font-size:13.5px;margin-bottom:6px}
.field textarea{width:100%;min-height:84px;border:2px solid var(--edge);border-radius:8px;padding:8px;background:#fff;color:var(--ink);resize:vertical}
/* vocab */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.flip{display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:center;min-height:170px;padding:14px 16px;border-radius:14px;border:3px solid var(--a);background:#fff;cursor:pointer;text-align:left;box-shadow:0 5px 0 var(--a)}
.flip[aria-pressed=true]{background:var(--tint)}
.flip .pos{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--a);color:var(--on);padding:2px 9px;border-radius:999px}
.flip .w{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink-a);line-height:1.15}
.flip .h{font-size:12.5px;color:var(--ink2)}
.flip .uk{font-weight:700;font-size:16px}
.flip .d{font-size:15px}
.flip .e{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--ink2)}
/* exercises */
.ex{background:#fff;border:2.5px solid var(--edge);border-top:10px solid var(--a);border-radius:16px;padding:16px 18px}
.ex>h3{font-size:22px;margin:4px 0 4px}
.instr{margin:0 0 12px;color:var(--ink2)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:10px;background:var(--tint);border-radius:12px}
.bank span{background:#fff;border:2px solid var(--a);color:var(--ink);border-radius:8px;padding:2px 10px;font-weight:700;font-size:15px}
.exbody{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.item{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.item .q{margin:0 0 8px}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--a);color:var(--on);font-size:13px;font-weight:700;margin-right:8px;padding:0 7px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:44px;background:#fff;border:2px solid var(--ink2);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt .l{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--ink-a);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.opt:hover:not([disabled]){background:var(--tint)}
.opt.ok{background:var(--ok);border-color:var(--okline)}
.opt.bad{background:var(--bad);border-color:var(--badline)}
.opt[disabled]{cursor:default}
.in{border:2px solid var(--ink2);border-radius:8px;padding:4px 8px;min-height:40px;background:#fff;max-width:100%}
.in.ok{background:var(--ok);border-color:var(--okline)}.in.bad{background:var(--bad);border-color:var(--badline)}
select.in{max-width:100%}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--ok)}.fb.bad{background:var(--bad)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:2px dashed var(--line)}
.score{margin-left:auto;font-weight:700;color:var(--ink-a)}
.rwbox textarea{width:100%;min-height:70px;border:2px solid var(--ink2);border-radius:8px;padding:8px;background:#fff}
.mark2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.total{position:sticky;top:64px;z-index:5;background:var(--lime);color:var(--ink);border:2.5px solid var(--edge);border-radius:12px;padding:6px 14px;font-weight:700;display:inline-block}
.guide h3{font-size:22px;margin-bottom:8px}
.box{background:#fff;border:2.5px solid var(--edge);border-radius:16px;padding:16px 18px}
.box p{margin:0 0 8px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.col{border-radius:14px;padding:12px 14px;border:2.5px solid var(--edge)}
.col h4{font-size:18px;margin-bottom:6px}
.col ul{margin:0;padding-left:20px}.col li{margin-bottom:4px}
.tw{overflow-x:auto}
table.pt{border-collapse:collapse;width:100%;min-width:520px;background:#fff}
table.pt th,table.pt td{border:2px solid var(--edge);padding:8px 10px;text-align:left;vertical-align:top}
table.pt th{background:var(--ink);color:#fff}
.big-q{font-family:var(--serif);font-size:clamp(22px,4vw,30px);font-weight:700;margin:8px 0 10px}
.tbanner{background:var(--gold);font-weight:700;text-align:center;border-radius:8px;padding:3px;margin-bottom:10px;font-size:13px}
@media(max-width:560px){.thead{flex-direction:column;align-items:flex-start}.cue{padding:14px 14px}.model{font-size:17px}}

.tmap{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.tcard{display:flex;gap:12px;align-items:center;text-align:left;min-height:64px;padding:10px 14px;border-radius:14px;border:3px solid var(--a);background:#fff;cursor:pointer;box-shadow:0 4px 0 var(--a)}
.tcard:hover{background:var(--tint)}
.tcard .ic{font-size:28px;line-height:1}
.tcard b{font-family:var(--serif);font-size:17px;line-height:1.2}
.rnd .qbar{margin-top:8px}
.rnd .cue{margin-top:12px}
[data-hue=green]{--a:#24774B;--on:#fff;--ink-a:#1A5C3A;--tint:#E3F2E8}
[data-hue=violet]{--a:#7A5BD0;--on:#fff;--ink-a:#563CA6;--tint:#EEE9FA}
[data-hue=orange]{--a:#F2A068;--on:#26221B;--ink-a:#97470F;--tint:#FCEBDD}
[data-hue=blue]{--a:#3F68C2;--on:#fff;--ink-a:#2C4B93;--tint:#E3ECFA}
[data-hue=gold]{--a:#F0CB66;--on:#26221B;--ink-a:#765710;--tint:#FBF1D4}
[data-hue=magenta]{--a:#A8467A;--on:#fff;--ink-a:#812F5B;--tint:#F6E4EE}
[data-hue=brick]{--a:#A9593F;--on:#fff;--ink-a:#80402A;--tint:#F6E6DF}
[data-hue=teal]{--a:#2E7F78;--on:#fff;--ink-a:#215F59;--tint:#DDEFEC}
[data-hue=indigo]{--a:#5953B3;--on:#fff;--ink-a:#403C8C;--tint:#E8E7F6}
[data-hue=lime]{--a:#C5DD84;--on:#26221B;--ink-a:#4B6119;--tint:#F0F6DC}
[data-hue=sky]{--a:#86C7E8;--on:#26221B;--ink-a:#1F6891;--tint:#E4F2FA}
[data-hue=plum]{--a:#8A4B90;--on:#fff;--ink-a:#693370;--tint:#F2E6F4}
[data-hue=mint]{--a:#86D5B8;--on:#26221B;--ink-a:#1E664D;--tint:#E0F4EC}
[data-hue=pink]{--a:#F0A8C8;--on:#26221B;--ink-a:#94386A;--tint:#FBE8F1}
[data-hue=copper]{--a:#955A36;--on:#fff;--ink-a:#704324;--tint:#F5E8DB}
[data-hue=coral]{--a:#F3A09B;--on:#26221B;--ink-a:#9E3F3A;--tint:#FCE7E5}
[data-hue=navy]{--a:#3D5B86;--on:#fff;--ink-a:#2B4263;--tint:#E1E9F4}
[data-hue=olive]{--a:#667F2F;--on:#fff;--ink-a:#4A5F20;--tint:#EAF1D7}
[data-hue=peach]{--a:#F4C494;--on:#26221B;--ink-a:#8A4913;--tint:#FDEFE0}
[data-hue=lavender]{--a:#CDC1F1;--on:#26221B;--ink-a:#58409F;--tint:#F1EDFB}
[data-hue=crimson]{--a:#A3495D;--on:#fff;--ink-a:#7B3445;--tint:#F5E4E8}
[data-hue=steel]{--a:#4F7090;--on:#fff;--ink-a:#38546F;--tint:#E2EBF3}
[data-hue=sand]{--a:#DCC38E;--on:#26221B;--ink-a:#6E5518;--tint:#F8F1DF}
[data-hue=orchid]{--a:#BE9DDB;--on:#26221B;--ink-a:#6A3F96;--tint:#F3EBF9}
[data-hue=aqua]{--a:#7BCFD0;--on:#26221B;--ink-a:#1B6769;--tint:#DEF4F4}
[data-hue=moss]{--a:#4F7B40;--on:#fff;--ink-a:#42663A;--tint:#E5F0DF}
[data-hue=slate]{--a:#5A6479;--on:#fff;--ink-a:#40495B;--tint:#E4E7EE}

/* vocabulary list */
.muted{color:var(--ink2);font-size:14.5px;margin:4px 0 10px}
.vlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.vrow{background:#fff;border:2px solid var(--line);border-left:8px solid var(--a);border-radius:12px;padding:10px 14px}
.vh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.vn{min-width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--ink-a);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.vw{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink-a);line-height:1.2}
.vp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--tint);color:var(--ink-a);padding:2px 9px;border-radius:999px}
.vb{display:grid;gap:3px;font-size:15.5px}
.vb i{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2);margin-right:6px;text-transform:uppercase}
.vuk{font-weight:700}
.veg{font-family:var(--serif);font-style:italic;color:var(--ink2)}
.vlist.no-uk .vuk{display:none}
.vlist.no-def .vdef,.vlist.no-def .veg{display:none}
.plist{display:grid;gap:8px}
.prow{display:flex;gap:10px;align-items:baseline;background:#fff;border:2px solid var(--line);border-left:8px solid var(--a);border-radius:12px;padding:9px 14px}
.ptag{flex:0 0 auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;background:var(--tint);color:var(--ink-a);padding:2px 9px;border-radius:999px;white-space:nowrap}
.ptxt{font-family:var(--serif);font-size:16.5px;line-height:1.45}
.ptxt mark{background:var(--s4);color:var(--ink);padding:0 3px;border-radius:4px}
.bankctl{display:grid;gap:10px;grid-template-columns:1fr;margin:10px 0}
@media(min-width:700px){.bankctl{grid-template-columns:1fr 280px}}
.bsearch,.bsel{min-height:46px;padding:8px 14px;border:2px solid var(--edge);border-radius:12px;background:#fff;font-size:16px;width:100%}
.bgroup{display:grid;gap:10px}
.bhead{display:flex;align-items:center;gap:10px;background:var(--a);color:var(--on);border-radius:12px;padding:8px 14px;font-size:19px}
.bn{min-width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink-a);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media print{

  .layout{display:block!important;padding:0!important}

{html:`<h3>How to use this practice</h3>
<p><b>For each topic:</b> Part 1 (short answers), Part 2 (long turn with cue card), Part 3 (discussion), then Vocabulary and Practice.</p>
<p>1. Read the <b>answer formula</b> at the top of each part. The colours stay the same everywhere.<br>
2. Answer <b>out loud</b> with the timer. Do not write the full answer first.<br>
3. Open the <b>model answer</b> only after you speak. Compare the structure, not the exact words.<br>
4. Learn the vocabulary cards, then do the Practice tab.<br>
5. Do the topic again a few days later with a different question.</p>
<p>Examiners notice memorised answers. Use the models as examples of structure and language, not as scripts.</p>`},
{cls:'cols',html:`
<div class="col s1"><h4>Part 1: A · R · E</h4><ul><li><b>A</b>nswer straight away</li><li><b>R</b>eason (because…)</li><li><b>E</b>xample: a small real detail</li></ul><p>2–3 sentences. 15–25 seconds.</p></div>
<div class="col s2"><h4>Part 2: 4 steps</h4><ul><li><b>Scene</b>: what, who, when</li><li><b>Details</b>: every bullet on the card</li><li><b>Moment</b>: one real episode</li><li><b>Reflection</b>: why it matters</li></ul><p>Up to 2 minutes. About 220–280 words.</p></div>
<div class="col s3"><h4>Part 3: O · R · E · C</h4><ul><li><b>O</b>pinion</li><li><b>R</b>eason</li><li><b>E</b>xample (general or real)</li><li><b>C</b>ounter-view (other side)</li></ul><p>30–45 seconds. Think first.</p></div>`},
{html:`<h3>Phrase bank: sound natural, not memorised</h3>
<div class="tw"><table class="pt"><thead><tr><th>Function</th><th>Use</th></tr></thead><tbody>
<tr><td><b>Buying thinking time</b></td><td>That's a tricky one… / Let me think… / I've never really thought about it, but… / Off the top of my head,…</td></tr>
<tr><td><b>Giving an opinion</b></td><td>I'd say that… / As I see it,… / If you ask me,… / I'm inclined to think…</td></tr>
<tr><td><b>Softening</b></td><td>To some extent,… / It tends to be… / More often than not,… / For the most part,…</td></tr>
<tr><td><b>Giving an example</b></td><td>Take… for instance. / A case in point is… / Just think of…</td></tr>
<tr><td><b>The other side</b></td><td>That said,… / Admittedly,… / On the flip side,… / Having said that,…</td></tr>
<tr><td><b>Speculating</b></td><td>I suspect… / It's quite likely that… / I wouldn't be surprised if… / My guess is that…</td></tr>
<tr><td><b>Correcting yourself</b></td><td>Or rather,… / What I mean is,… / Let me put it another way: …</td></tr>
<tr><td><b>Concluding</b></td><td>All things considered,… / So, in the end,… / Overall, I'd say…</td></tr>
</tbody></table></div>`},
{html:`<h3>What the examiner listens for</h3>
<p><b>Fluency and coherence:</b> keep going, link ideas (because, which means, so, although). Pausing to think is fine; repeating the same word again and again is not.</p>
<p><b>Lexical resource:</b> precise words and natural collocations, plus the ability to paraphrase when you forget a word.</p>
<p><b>Grammatical range and accuracy:</b> a mix of simple and complex sentences (conditionals, relative clauses, passives), with few errors that block meaning.</p>
<p><b>Pronunciation:</b> clear sounds, stress and intonation. Speak at a natural speed, not fast.</p>
<p>Part 1 lasts 4–5 minutes, Part 2 about 3–4 minutes including preparation, Part 3 4–5 minutes. The whole test is 11–14 minutes.</p>`}
]};

 `I'd like to talk about a night train journey I took with my university group two years ago. We were coming back from a competition in Gdańsk, and we had to present a project the very next morning, so there was no chance to rest.`,
 `The reason I was so <mark>sleep-deprived</mark> was that I'd been <mark>burning the midnight oil</mark> for a week, finishing slides and rehearsing. On top of that, the carriage was freezing and the person opposite snored, so I just <mark>tossed and turned</mark> for hours. By the time we arrived I felt completely <mark>groggy</mark>, my head was pounding, but I still had to stand up and speak in front of forty people.`,

 `Looking back, I wouldn't recommend that approach to anyone. We won second place, but I slept for fourteen hours afterwards and promised myself never to leave everything to the last minute again. It taught me that <mark>restorative</mark> sleep matters more than one extra hour of cramming.`],

},
p3:[
{kind:`Opinion`,q:`Some people say that sleep is a waste of time. How would you respond?`,
 think:[`What do we lose when we do not sleep: memory, mood, health?`,`Why do some successful people brag about sleeping very little?`,`Is this idea linked to a culture of constant work?`],
 model:[`I'd strongly disagree, because sleep is when the brain does some of its most important work.`,`It helps us store memories and regulate our mood, so cutting it short actually makes people less productive, not more.`,`You can see it in students who stay up all night before an exam and then can't recall anything the next day.`,`That said, I understand why busy people feel that way; when there's so much to do, every hour seems precious.`]},

{kind:`Evaluate`,q:`Should schools start later in the morning?`,

],

id:'memory',nav:'Memory & Forgetting',icon:'🧠',hue:'orange',

p1:[

p3:[

{kind:`Evaluate`,q:`Should schools spend less time on learning facts by heart?`,
 think:[`Memorising versus understanding`,`Where memorising is unavoidable: vocabulary, formulas, dates`,`Exams and stress`],
 model:[`I'd say they should rebalance it rather than abandon it.`,`Pupils who simply <mark>commit</mark> facts <mark>to memory</mark> often forget them straight after the test, whereas understanding tends to last.`,`In language learning, for instance, nobody can hold a conversation without having memorised thousands of words.`,`So the real question is how to memorise, not whether to: spaced practice and using words in context beat last-minute cramming.`]},
{kind:`Explain`,q:`Why do older people often remember their childhood better than what happened yesterday?`,
 think:[`How often childhood stories are retold`,`Emotional intensity of early experiences`,`Everyday routine is easy to forget`],
 model:[`I think it has a lot to do with how often those memories are revisited.`,`Childhood stories are retold at family gatherings, so they keep getting reinforced, while yesterday's routine isn't worth remembering.`,`My grandfather can describe his school playground in precise detail, yet he can't recall where he put his glasses five minutes ago.`,`Admittedly, age-related changes in memory also play a part, so it's probably a combination of both.`]},
{kind:`Society`,q:`How important is it for a society to remember its history?`,
 think:[`Learning from past mistakes`,`National and family identity`,`Museums, memorials, personal testimonies`,`The risk of living in the past`],
 model:[`I'd argue it's essential.`,`A society that forgets its past is more likely to repeat its mistakes, and it also loses a sense of who it is.`,`Many countries keep museums and memorials for exactly this reason, and survivors' testimonies help young people understand events they never lived through.`,`On the other hand, dwelling on the past can keep old conflicts alive, so remembering has to go hand in hand with a willingness to move forward.`]}
],

id:'silence',nav:'Silence & Noise',icon:'🔇',hue:'blue',
blurb:`Sounds you love, sounds that drive you mad, and whether the modern world is simply too loud.`,
p1:[
{q:`Can you work or study in complete silence?`,
 ideas:[`Say yes or no, then qualify: "it depends on…"`,`What kind of noise helps or distracts you?`,`A real place: a library, a café, your room`],
 model:[`Not really, because total silence makes me restless.`,`A little background noise helps me concentrate: I can <mark>tune out</mark> a café, but not a quiet room where I hear every cough.`,`When I wrote my dissertation I worked in a library cafeteria rather than the silent reading room, and I finished a month early.`]},
{q:`Is there a sound that annoys you more than it should?`,
 ideas:[`Pick one tiny sound: chewing, tapping, clicking`,`Say why it is out of proportion`,`What do you do to escape it?`],
 model:[`Definitely people chewing loudly.`,`It's such a tiny sound, but for some reason it <mark>gets on my nerves</mark> more than a drill does.`,`At a family dinner last year I had to pretend my phone was ringing so that I could leave the table.`]},
{q:`What is the quietest place you have ever been to?`,
 ideas:[`Nature: a lake, a forest, a desert, snow`,`Describe the silence: what could you hear?`,`How did you feel?`],
 model:[`A mountain lake early in the morning.`,`There was no traffic and no voices, just the occasional bird, so the silence felt almost physical.`,`We stood there for five minutes without speaking, and I remember thinking how rare that kind of <mark>blissful silence</mark> has become.`]},
{q:`What sounds do you associate with your childhood home?`,
 ideas:[`Domestic sounds: a kettle, a radio, a sewing machine`,`Who made the sound?`,`Do you still react to it now?`],
 model:[`The clatter of my grandmother's old sewing machine.`,`She used it every evening, so it became the soundtrack of my childhood.`,`Even now, a similar rhythm in a shop feels oddly <mark>soothing</mark>.`]},
{q:`Can you hear your neighbours when you are at home?`,
 ideas:[`Which sounds: music, footsteps, a baby, a drill`,`How do you deal with it?`,`A funny or annoying example`],
 model:[`More than I'd like, to be honest.`,`Our building has <mark>paper-thin walls</mark>, so I know exactly when my neighbour practises the trumpet.`,`On Sundays I <mark>can't hear myself think</mark>, so I usually escape to a café.`]},
{q:`Would you ever try a silent retreat, a few days without speaking?`,
 ideas:[`Yes / no, with a clear reason`,`What would be hardest? What would you gain?`,`Has anybody you know done it?`],
 model:[`I'd love to, although I suspect the first day would be torture.`,`I talk constantly, so being silent would force me to notice things I usually miss.`,`A friend did a three-day retreat and said that by the second day the <mark>din</mark> in her head had finally died down.`]},
{q:`What is the loudest place you have ever been to?`,
 ideas:[`A stadium, a concert, a factory, a wedding`,`How loud? Use a strong adjective`,`How did you communicate or cope?`],
 model:[`A football stadium during a derby.`,`The crowd was so loud that the noise was literally <mark>deafening</mark>; I could feel the bass in my chest.`,`My friend shouted in my ear and I still couldn't hear a word, so we communicated entirely through gestures.`]}
],
p2:{
 cue:`Describe a moment when a sudden silence or a sudden loud noise changed the mood of a situation.`,
 say:[`where you were and what was happening`,`what the silence or noise was`,`how people reacted`,`and explain why you still remember this moment.`],
 follow:`Is silence always a good thing?`,
 model:[
 `I'd like to describe a moment during my cousin's wedding, about three years ago. It was a lively evening in a restaurant by a lake, with about eighty guests and a band so loud it was almost <mark>deafening</mark>, and everybody was dancing or talking at the top of their voices.`,
 `Suddenly the electricity went off. In a second the <mark>din</mark> vanished: the music stopped, the lights died, and the whole room fell silent. After a few seconds of confusion you could hear a baby giggling and the water outside, which none of us had noticed all evening. People stood still, some laughed nervously, and a few used their phones as torches.`,
 `Then my grandfather, who is almost ninety, started singing an old folk song in his thin, shaky voice. One by one the guests joined in, and what had been a <mark>cacophony</mark> of voices became a single, soft chorus. I remember the candles the waiters brought and my aunt wiping away tears.`,
 `I still remember it because it showed me how much noise we normally live in. That <mark>blissful silence</mark> lasted perhaps a minute, but it turned an ordinary party into something genuinely moving. Since then I've tried to leave a few quiet moments in my day.`],
 tip:`The Scene is full of noise on purpose, so that the silence in the Details feels dramatic. The Moment is a precise scene (a grandfather singing), and the Reflection answers the last bullet: why the moment is still remembered.`
},
p3:[
{kind:`Opinion`,q:`Do you think the world is becoming too noisy?`,
 think:[`Traffic, building work, music in shops, personal audio`,`Effects on sleep, stress and health`,`Is it a problem for everyone, or only for some people?`],
 model:[`I'd say yes, particularly in public spaces.`,`Background music in shops and constant traffic mean many of us rarely experience real quiet, and <mark>noise pollution</mark> has been linked to stress and poor sleep.`,`Some cities have even limited night-time construction work because residents' health was suffering.`,`On the other hand, plenty of people find a certain amount of noise comforting, since total silence can feel lonely.`]},
{kind:`Evaluate`,q:`Should loud music be banned in public places such as buses and parks?`,
 think:[`Whose space is it?`,`Rules versus politeness`,`Festivals and street performers: where is the line?`],
 model:[`I'd support restrictions rather than a complete ban.`,`Public space belongs to everyone, and nobody should be forced to listen to someone else's music.`,`Some trains have quiet carriages, and they work well precisely because passengers choose to sit there.`,`Admittedly, enforcing rules on individuals is hard, and music can bring a community together at a festival, so context matters.`]},
{kind:`Compare`,q:`Do you think children today are more used to noise than previous generations?`,
 think:[`Screens, music, toys that make sounds`,`Do children need silence to learn?`,`Differences between homes and schools`],
 model:[`I think so, although it's hard to be certain.`,`Many children grow up with constant background sound, such as television, tablets and music, so silence can feel unnatural to them.`,`In my experience, kids often can't do homework without something playing, whereas their grandparents studied in complete silence.`,`That said, noise isn't necessarily harmful; some children actually concentrate better with a bit of sound.`]},
{kind:`Explain`,q:`Is silence important for creativity?`,
 think:[`Time to think and to be bored`,`Writers, composers and scientists who need solitude`,`Artists who work well in noisy places`],
 model:[`In my view it often is, though not for everyone.`,`Quiet gives the mind space to wander, and some of our best ideas come when nobody is interrupting us.`,`Many writers and composers deliberately retreat to remote cabins in order to work.`,`On the other hand, plenty of artists thrive in noisy cafés or busy studios, so it really depends on the individual.`]}
],

p1:[

 `I'd like to talk about Wangari Maathai, a Kenyan activist who <mark>dedicated</mark> her life to protecting forests and the women who depend on them. I first read about her at university, and I've admired her ever since.`,
 `In 1977 she founded the Green Belt Movement, a <mark>grassroots</mark> organisation that encouraged rural women to plant trees. At that time, deforestation was leaving villages short of firewood and washing away the soil. Her idea was simple but clever: women received a small payment for every seedling that survived, which gave them both an income and a reason to protect the land. Over the following decades the movement planted tens of millions of trees, and in 2004 she became the first African woman to win the Nobel Peace Prize.`,

id:'history',nav:'Historic Places & Old Buildings',icon:'🏛️',hue:'brick',
blurb:`Buildings with a past: why we keep them, who pays, and what is lost when they disappear.`,
p1:[
{q:`Is there a building in your area that you would hate to see demolished?`,
 ideas:[`Name it and say what it is used for`,`Why does it matter: beauty, memories, meeting place?`,`Has anyone suggested knocking it down?`],
 model:[`Yes, the old railway station in my town.`,`It's slightly shabby, but it's an <mark>architectural gem</mark>, and the clock tower is where everybody arranges to meet.`,`There's talk of replacing it with a shopping centre, so I signed a petition last month.`]},
{q:`What is the oldest place you have ever been inside?`,
 ideas:[`A church, castle, cave, house: say roughly how old`,`What could you see, hear, smell?`,`How did it feel to be there?`],
 model:[`A small stone chapel in the mountains, apparently more than seven hundred years old.`,`The whole village is <mark>steeped in history</mark>, and inside the chapel it was so cold and silent that time seemed to have stopped.`,`I put my hand on the wall and thought about how many generations had done exactly the same.`]},
{q:`Would you ever live in a very old house, with creaky floors and thick walls?`,
 ideas:[`Say yes or no and add "as long as…"`,`Pros: character, thick walls. Cons: heating, repairs`,`A real old house you know`],
 model:[`I'd love to, as long as the heating works.`,`Old houses have character, and thick walls keep the heat out in summer.`,`My grandparents' house has <mark>withstood the test of time</mark>: it's over a hundred years old and still solid, and it feels warmer than any modern flat I've lived in.`]},
{q:`Have you ever visited a historic place that disappointed you?`,
 ideas:[`What did you expect, and what did you find?`,`Crowds? Too many shops? Too much restoration?`,`Would you give it a second chance?`],
 model:[`Yes, a famous castle that turned out to be a letdown.`,`It had been <mark>restored</mark> so heavily that it looked like a film set rather than a real medieval building.`,`There were gift shops in every hall, and I couldn't imagine anyone ever having lived there.`]},
{q:`Do you prefer visiting ruins or buildings that have been fully restored?`,
 ideas:[`Choose one and explain with a contrast`,`Imagination versus comfort and information`,`A place where you saw each type`],
 model:[`Ruins, every time.`,`They transport me to a <mark>bygone era</mark> in a way that perfect reconstructions can't, and you can see how the building was actually made.`,`Walking through a half-collapsed monastery last summer, I spent an hour imagining daily life there, which a tidy reconstruction would never have allowed.`]},
{q:`Have you ever felt that a place had a special atmosphere, even a slightly spooky one?`,
 ideas:[`Where was it and what time of day?`,`What exactly created the feeling: silence, light, smell?`,`How did the people around you react?`],
 model:[`Yes, in an empty old theatre I was once shown around.`,`The building was <mark>dilapidated</mark>, but the seats were still there and there was a strange hush, as if the audience had only just left.`,`Nobody spoke above a whisper, which is odd, because we're normally a noisy group.`]},
{q:`When you visit a historic place, do you read the information boards or just wander around?`,
 ideas:[`Be honest: wanderer or reader?`,`Why does this style suit you?`,`What do you do afterwards?`],
 model:[`I'm a wanderer, I'm afraid.`,`I like to get a feeling for the place first and read the details afterwards.`,`In Kraków I walked around the Old Town for two hours and then sat in a café with a guidebook, matching the facts to what I had seen.`]}
],
p2:{
 cue:`Describe a historic place (a building, a monument or an area) that you think is worth preserving.`,
 say:[`where it is and how old it is`,`what it looks like`,`how people use or visit it today`,`and explain why it is important to preserve it.`],
 follow:`Who should pay for the preservation of historic buildings?`,
 model:[
 `I'd like to talk about the old watermill on the edge of my home town, which for me is a real <mark>landmark</mark>. It stands beside a small river, about two kilometres from the centre, and it has been there for roughly three hundred years.`,
 `It's a long, low building made of stone and dark timber, with a huge wooden wheel that, remarkably, still turns in spring when the water is high. For decades it was <mark>dilapidated</mark>: the roof leaked and the windows were boarded up, and the council wanted to <mark>tear it down</mark>. Fortunately, a group of local volunteers raised money to <mark>restore</mark> it, and today it's a small museum and café where school groups learn how flour was once made.`,
 `I remember visiting with my class when I was nine. The guide let us grind a handful of wheat by hand, and the smell of warm flour is still vivid in my mind. Years later I took my niece, and she asked exactly the questions I once had.`,
 `I think it's worth preserving because it's <mark>a testament to</mark> how our ancestors lived and worked, and once it's gone, nothing can bring it back. A new building can always be built, but this mill has <mark>withstood the test of time</mark> and ties each generation to the one before. Whenever I pass it, I feel part of something bigger.`],
 tip:`A small, local place can be a stronger Part 2 topic than a famous monument, because you know real details. The Details cover age, appearance and use; the Moment is a personal scene (grinding wheat); the Reflection answers the last bullet (why preserve it).`
},
p3:[
{kind:`Explain`,q:`Why is it important to preserve old buildings?`,
 think:[`A building as evidence of the past`,`Identity and pride`,`Tourism and the economy`],
 model:[`I'd say it's important because buildings are a physical record of our past.`,`Books can describe how people lived, but a building lets you stand inside that history, and once it's demolished the evidence is lost for ever.`,`Towns that have kept their old centres tend to attract huge numbers of visitors and have a strong sense of identity.`,`That said, preserving everything isn't realistic, so societies have to decide which buildings truly matter.`]},
{kind:`Evaluate`,q:`Should old buildings be demolished to make room for new housing?`,
 think:[`The need for housing versus heritage`,`Converting old buildings instead of knocking them down`,`Unsafe buildings that cannot be saved`],
 model:[`Not as a rule, but there are cases where it's justified.`,`Cities need housing, yet many old buildings can be converted into flats, which saves both heritage and materials.`,`Old factories and warehouses have been turned into apartments and galleries in many cities, and they're often the most popular places to live.`,`However, if a building is unsafe or beyond repair, restoring it can cost more than it's worth, and then demolition makes sense.`]},
{kind:`Responsibility`,q:`Who should pay for the upkeep of historic buildings: the government, the owners or tourists?`,
 think:[`Heritage belongs to everyone`,`Entrance fees and their effect on local people`,`Private owners of listed buildings`],
 model:[`I think the cost should be shared.`,`Heritage belongs to everyone, so public funding is fair, but owners and visitors also benefit.`,`Many sites charge an entrance fee that goes straight into repairs, while the state helps with the biggest projects.`,`The risk is that if tourists carry most of the cost, prices might exclude local people, so there should be some free days.`]},
{kind:`Predict`,q:`Will people in the future care less about history?`,
 think:[`Roots and identity in a fast-changing world`,`Young people and digital life`,`The role of schools and museums`],
 model:[`I'm not convinced they will; if anything, interest might grow.`,`The faster and more global life becomes, the more people seem to look for roots.`,`Family-history websites and heritage festivals are more popular than they used to be.`,`On the other hand, younger people can be more focused on the future, so schools and museums have to make history feel relevant.`]}
],

p1:[

p2:{

 `I'd like to talk about something I witnessed at a language school where I used to work part-time, about five years ago. A new colleague, a very talented teacher in her fifties, had applied for a senior position.`,
 `She had more experience than anyone else, but the manager gave the job to a younger man with a fraction of her qualifications. When someone asked why, the answer was vague: they were "looking for a fresh image". Everyone knew what that meant, but most people <mark>turned a blind eye</mark>, because they were afraid of losing their own jobs. It was obvious that she was being <mark>discriminated against</mark> because of her age, and she knew it too.`,

id:'festivals',nav:'Festivals & Traditions',icon:'🎉',hue:'orchid',
blurb:`Why we keep celebrating the same days the same way, and what traditions do for us.`,
p1:[
{q:`Which holiday or celebration do you look forward to most each year?`,
 ideas:[`Name it`,`What do you do?`,`Why is it special?`],
 model:[`New Year's Eve, though not for the party.`,`I love the hour before midnight, when the whole family is in the kitchen and everyone is a bit <mark>excited</mark> and a bit sentimental.`,`It feels like a pause between one year and the next.`]},
{q:`Is there a tradition in your family that other people might find unusual?`,
 ideas:[`What is it?`,`How did it start?`,`Would you keep it?`],
 model:[`Yes, we always eat the same soup on the first day of the year.`,`Nobody remembers who started it, but missing it would feel like bad luck.`,`Visitors find it odd, but they usually end up asking for a second bowl.`]},
{q:`Do you prefer big celebrations or quiet ones?`,
 ideas:[`Choose`,`Why?`,`Your last birthday`],
 model:[`Quiet ones, definitely.`,`I'd rather have dinner with four people who know me well than a big party where I have to shout over the music.`,`My last birthday was just a picnic by the river, and it was perfect.`]},
{q:`Have you ever celebrated a festival in another country?`,
 ideas:[`Which and where?`,`What was different?`,`What did you learn?`],
 model:[`Yes, a local harvest festival in a Polish village.`,`There were wreaths, folk songs and enormous amounts of food, and strangers invited us to join in.`,`What struck me was how similar it felt to the traditions of my own grandparents.`]},
{q:`Do you think people spend too much money on celebrations?`,
 ideas:[`Your opinion`,`Gifts, food, decorations`,`A personal example`],
 model:[`Sometimes, yes.`,`People feel pressure to buy expensive gifts, though what makes a celebration memorable is usually the company.`,`The best present I've ever received was a handwritten story from my sister.`]},
{q:`Is there a celebration from your childhood that you miss?`,
 ideas:[`Which one?`,`What made it special?`,`Why doesn't it happen now?`],
 model:[`Yes, the village fair in my grandparents' town.`,`There were wooden stalls, a little band and a huge swing, and the whole village was there.`,`It stopped when the fairground closed, and I've missed that <mark>sense of community</mark> ever since.`]},
{q:`Who usually organises celebrations in your family?`,
 ideas:[`A specific person`,`What do they do?`,`Would you like to take over?`],
 model:[`My mother, as she's the family's unofficial event manager.`,`She plans the menu weeks in advance and phones everyone to make sure nobody is forgotten.`,`I'd like to help more, though I'm afraid I'd forget the dessert.`]}
],
p2:{
 cue:`Describe a traditional festival or celebration that is important in your country.`,
 say:[`what the festival is and when it takes place`,`how people prepare for it and celebrate it`,`what you personally do or remember`,`and explain why it is important to people.`],
 follow:`Do traditions help to preserve a nation's identity?`,
 model:[
 `I'd like to talk about Christmas Eve in Ukraine, known as Sviata Vecheria, the Holy Supper. It takes place on the evening of the 24th of December, though many families now celebrate it in January, and it's one of the most meaningful days of the year for us.`,
 `Preparations start days in advance. The table is covered with a white cloth, with some hay underneath, and families prepare twelve meatless dishes, among them kutia, which is a sweet dish made of wheat, honey and poppy seeds. Traditionally the meal begins when the first star appears in the sky, and children are often sent to the window to find it. A sheaf of wheat called a didukh stands in the corner of the room as a symbol of ancestors.`,
 `My clearest memory is standing at the window as a child with my cousin, frozen with excitement and arguing about which star was the first. When we finally shouted, my grandmother smiled and lit the candle, and the whole family went quiet for a moment before the meal.`,
 `This celebration matters because it keeps families together and links generations. Even people who are far from home keep these <mark>customs</mark> alive, which gives them <mark>a sense of belonging</mark>. In my view, a tradition like this is a way for a community to <mark>pass on</mark> its history and values.`],
 tip:`Choose a festival you know well and keep to its main customs. The Scene gives name and date; the Details give preparation and celebration (two bullets); the Moment is your clearest childhood memory; the Reflection says why it matters to people.`
},
p3:[
{kind:`Explain`,q:`Why are traditions important to a society?`,
 think:[`Identity and belonging`,`Passing values between generations`,`Stability in a changing world`],
 model:[`Because they give people a sense of identity and continuity.`,`Customs connect generations and carry shared values, such as respect for elders or hospitality.`,`In a world that changes quickly, they offer something stable to hold on to.`,`That said, traditions that cause harm should be questioned, so respect doesn't mean blind imitation.`]},

var STARTS=['That said','However','Admittedly','On the other hand','Of course','In my view','In my experience','To be honest','Personally','In short','In the end','Looking back','At first','What struck me','What I remember','It depends','In some ways','The downside is','On the whole','Mostly because','I think','I\'d say','I believe','I suspect','I expect','I\'d guess','Probably','Definitely','Honestly'];
function sentencesOf(txt){return String(txt).split(/(?<=[.!?])\s+(?=[A-Z"'])/).map(function(s){return s.trim()}).filter(Boolean)}
function phraseItems(t){
  var marks=[],starts=[],seen={};
  function take(src,txt){
    sentencesOf(txt).forEach(function(s){
      if(seen[s])return;seen[s]=1;
      if(s.indexOf('<mark>')>-1)marks.push({src:src,html:s});
      for(var i=0;i<STARTS.length;i++){var k=STARTS[i];
        if(s.indexOf(k)===0&&/^[,\s.]/.test(s.slice(k.length))){starts.push({src:src,key:k,html:'<b>'+k+'</b>'+s.slice(k.length)});break}}
    });
  }
  t.p1.forEach(function(q){take('Part 1',q.model.join(' '))});
  take('Part 2',t.p2.model.join(' '));
  t.p3.forEach(function(q){take('Part 3',q.model.join(' '))});
  return {marks:marks,starts:starts};
}
function vrow(v,n){

  return r;
}

function show(){
  clearTimers();
  chips.forEach(function(c){var on=c.__id===cur;c.setAttribute('aria-current',on?'true':'false');if(on){var sc=document.getElementById('sideCur');if(sc)sc.textContent=c.__label;if(c.scrollIntoView&&window.innerWidth>=900){var box=c.parentNode,top=c.offsetTop;if(top<box.scrollTop||top>box.scrollTop+box.clientHeight-60)box.scrollTop=Math.max(0,top-80)}}});
  $view.innerHTML='';
  var t=tops.filter(function(x){return x.id===cur})[0];
  var wrap=el('div','stack');wrap.setAttribute('data-hue',t.hue);
  if(TEACHER)wrap.appendChild(el('div','tbanner','Teacher mode: "Show answers" is available in the Practice tab'));
  if(cur==='start'){
    wrap.appendChild(el('div','thead','<div class="big">⭐</div><div><h2>Start here</h2><p>How the practice works, the three answer formulas, and a phrase bank you can use in every topic.</p></div>'));
    viewStart(wrap);viewGuide(wrap);
  }else if(cur==='bank'){
    wrap.appendChild(el('div','thead','<div class="big">Aa</div><div><h2>Vocabulary bank</h2><p>Every word and expression from all topics, with translations, examples and phrases from the model answers.</p></div>'));
    viewBank(wrap);
  }else{
    wrap.appendChild(el('div','thead','<div class="big">'+t.icon+'</div><div><h2>'+t.nav+'</h2><p>'+t.blurb+'</p></div>'));
    var sn=el('div','sub-nav');
    [['p1','Part 1'],['p2','Part 2'],['p3','Part 3'],['vocab','Vocabulary'],['ex','Practice']].forEach(function(x){
      var b=el('button','tab',x[1]);b.type='button';b.setAttribute('aria-current',sub===x[0]?'true':'false');
      b.onclick=function(){sub=x[0];sset('sub',sub);show()};sn.appendChild(b);
    });
    wrap.appendChild(sn);
    var box=el('div','stack');wrap.appendChild(box);
    ({p1:viewP1,p2:viewP2,p3:viewP3,vocab:viewVocab,ex:viewPractice})[sub](t,box);
    var next=el('div','bar');
    var idx=tops.indexOf(t);
    if(idx<tops.length-1)next.appendChild(btn('Next topic: '+tops[idx+1].nav+' →','lime',function(){cur=tops[idx+1].id;sset('top',cur);show()}));
    wrap.appendChild(next);
  }
  $view.appendChild(wrap);window.scrollTo(0,0);
}
(function(){
  var h=el('div','side-h','Topics');$nav.appendChild(h);
  tops.forEach(function(t,i){
    var c=el('button','ti','<span class="num">'+(i===0?'★':(i===1?'Aa':i-1))+'</span><span class="tn">'+esc(t.nav)+'</span>');
    c.type='button';c.__id=t.id;c.__label=(i<2?'':(i-1)+'. ')+t.nav;c.setAttribute('data-hue',t.hue);
    c.onclick=function(){cur=t.id;sset('top',cur);closeSide();show()};$nav.appendChild(c);chips.push(c);
    if(i===1)$nav.appendChild(el('div','side-h','Speaking topics'));
  });
})();
var $side=document.getElementById('side'),$tgl=document.getElementById('sideToggle');
function closeSide(){$side.classList.remove('open');$tgl.setAttribute('aria-expanded','false')}
$tgl.onclick=function(){var o=$side.classList.toggle('open');$tgl.setAttribute('aria-expanded',o?'true':'false')};
show();
})();

</script>
</body></html>
